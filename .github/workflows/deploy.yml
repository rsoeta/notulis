name: Deploy Notulis to cPanel & GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Deploy Frontend (dist/) ke cPanel Hosting"
        type: boolean
        default: true
      deploy_gas:
        description: "Deploy Backend Google Apps Script (backend-gas/)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-notulis-main
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      gas: ${{ steps.filter.outputs.gas }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Evaluate deployment targets
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FRONTEND: ${{ inputs.deploy_frontend }}
          INPUT_GAS: ${{ inputs.deploy_gas }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "frontend=${INPUT_FRONTEND:-true}" >> "$GITHUB_OUTPUT"
            echo "gas=${INPUT_GAS:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Initial commit detected: deploying frontend."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "gas=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only HEAD~1 HEAD)
          deploy_fe="false"
          deploy_gas="false"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" =~ ^backend-gas/ ]] || [ "$file" = "scripts/deploy-gas.mjs" ]; then
              deploy_gas="true"
            elif [[ ! "$file" =~ \.md$ ]]; then
              deploy_fe="true"
            fi
          done <<< "$changed_files"

          echo "frontend=$deploy_fe" >> "$GITHUB_OUTPUT"
          echo "gas=$deploy_gas" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build & Deploy Frontend (cPanel)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate required secrets
        shell: bash
        env:
          HAS_GAS_URL: ${{ secrets.VITE_GAS_WEBAPP_URL != '' }}
          HAS_API_KEY: ${{ secrets.VITE_API_KEY != '' }}
          HAS_SITE_URL: ${{ secrets.VITE_SITE_URL != '' }}
          HAS_TURNSTILE: ${{ secrets.VITE_TURNSTILE_SITE_KEY != '' }}
          HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_HOST != '' && secrets.SSH_USER != '' }}
          HAS_FTP: ${{ secrets.FTP_PASSWORD != '' && secrets.FTP_HOST != '' && secrets.FTP_USERNAME != '' }}
        run: |
          for var_name in HAS_GAS_URL HAS_API_KEY HAS_SITE_URL HAS_TURNSTILE; do
            if [ "${!var_name}" != "true" ]; then
              echo "::error::Missing required GitHub Secret for $var_name (VITE_*)"
              exit 1
            fi
          done
          if [ "$HAS_SSH" != "true" ] && [ "$HAS_FTP" != "true" ]; then
            echo "::error::Configure either SSH secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY) or FTPS secrets (FTP_HOST, FTP_USERNAME, FTP_PASSWORD)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_GAS_WEBAPP_URL: ${{ secrets.VITE_GAS_WEBAPP_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Verify build artifacts & .env isolation
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          if find dist -maxdepth 3 -name ".env*" | grep -q .; then
            echo "::error::Sensitive .env file found inside dist/!"
            exit 1
          fi
          if grep -rnE '\b(alert|confirm|prompt)\s*\(' src/ >/dev/null; then
            echo "::error::Native browser dialog detected in src/"
            exit 1
          fi

      - name: Deploy via SSH + rsync (zero-downtime staged swap)
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          TARGET_PATH="${DEPLOY_PATH:-/home/stuw/stuw8183/public_html/repositories/notulis}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p \"$TARGET_PATH\""

          rsync -az --delay-updates --delete-after \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.git/' \
            --exclude='error_log' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${TARGET_PATH}/"

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key

      - name: Deploy via FTPS (fallback when SSH unavailable)
        if: ${{ secrets.SSH_PRIVATE_KEY == '' && secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/repositories/notulis/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/.env.*
            **/.well-known/**
            **/cgi-bin/**
            **/.git*/**
            **/error_log

      - name: Post-deploy HTTP smoke test
        shell: bash
        env:
          SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          TARGET_URL="${SITE_URL:-https://notulis.studio-pasti.net}"
          TARGET_URL="${TARGET_URL%/}"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${TARGET_URL}/")
          echo "HTTP status from ${TARGET_URL}/: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Expected HTTP 200 from ${TARGET_URL}/, got ${STATUS}"
            exit 1
          fi

  deploy-gas:
    name: Validate & Deploy Google Apps Script
    needs: detect-changes
    if: needs.detect-changes.outputs.gas == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate GAS syntax
        run: |
          node -e "
            const fs = require('fs');
            new Function(fs.readFileSync('backend-gas/turnstile.gs', 'utf8'));
            new Function(fs.readFileSync('backend-gas/Code.gs', 'utf8'));
            console.log('GAS syntax OK');
          "

      - name: Validate GAS secrets
        shell: bash
        env:
          HAS_CLASPRC: ${{ secrets.CLASP_RC_JSON != '' }}
          HAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID != '' }}
          HAS_DEPLOY_ID: ${{ secrets.GAS_DEPLOYMENT_ID != '' || secrets.VITE_GAS_WEBAPP_URL != '' }}
        run: |
          for var_name in HAS_CLASPRC HAS_SCRIPT_ID HAS_DEPLOY_ID; do
            if [ "${!var_name}" != "true" ]; then
              echo "::error::Missing required GAS Secret: $var_name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Push & Deploy GAS Web App via clasp
        shell: bash
        env:
          CLASP_RC_JSON: ${{ secrets.CLASP_RC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
          VITE_GAS_WEBAPP_URL: ${{ secrets.VITE_GAS_WEBAPP_URL }}
        run: |
          printf '%s' "$CLASP_RC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

          npm run gas:init -- "$GAS_SCRIPT_ID"

          DEPLOY_ID="$GAS_DEPLOYMENT_ID"
          if [ -z "$DEPLOY_ID" ]; then
            DEPLOY_ID=$(echo "$VITE_GAS_WEBAPP_URL" | sed -n 's|.*/macros/s/\([^/]*\)/exec.*|\1|p')
          fi

          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Unable to resolve GAS Deployment ID from GAS_DEPLOYMENT_ID or VITE_GAS_WEBAPP_URL"
            exit 1
          fi

          node scripts/deploy-gas.mjs -i "$DEPLOY_ID" "CI/CD Auto-Deploy (${GITHUB_SHA::7})"

      - name: Cleanup clasp credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" backend-gas/.clasp.json
